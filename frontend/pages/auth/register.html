<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | Poultry Intelligence</title>

    <link
        rel="stylesheet"
        href="../../css/styles.css"
    >

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Create Account</h1>

            <p>Register your poultry business</p>

            <form id="registerForm">

                <div class="form-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        id="name"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <div class="password-box">
     
                        <input
                           type="password"
                           id="password"
                           placeholder="Password">
                
                           <span
                           id="togglePassword">
                  
                           👀
                  
                        </span>
                
                    </div>

                </div>

                <button type="submit">
                    Register
                </button>

            </form>

            <p class="auth-link">

                Already have an account?

                <a href="./login.html">
                    Login
                </a>

            </p>

        </div>

    </div>

    <script src="../../js/database.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/register.js"></script>
    <script src="../../js/togglePassword.js"></script>
</body>
</html>
