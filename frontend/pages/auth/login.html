<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <link
        rel="stylesheet"
        href="../../css/styles.css"
    >

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>Login</h1>

        <form id="loginForm">

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="loginEmail"
                    required
                >

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    required
                >

            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <p class="auth-link">

            Don't have an account?

            <a href="./register.html">
                Register
            </a>

        </p>

    </div>

</div>

<script src="../../js/database.js"></script>
<script src="../../js/authStorage.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/login.js"></script>

</body>
</html>
