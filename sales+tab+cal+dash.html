<!DOCTYPE html>
<html>

<head>
   <title>Poultry Dashboard</title>

   <link rel="stylesheet"
   href="styles.css">
</head>

<body>

   <h1>Poultry Feed Sales Dashboard</h1>

   <!-- DASHBOARD -->

   <div class="dashboard">

      <div class="card">
         <h3>Total Sales</h3>
         <h2 id="totalSales">0</h2>
      </div>

      <div class="card">
         <h3>Total Quantity</h3>
         <h2 id="totalQuantity">0</h2>
      </div>

      <div class="card">
         <h3>Total Revenue</h3>
         <h2 id="totalRevenue">0</h2>
      </div>

   </div>


   <!-- FORM -->

   <input
      type="text"
      id="customer"
      placeholder="Customer Name"
   >

   <input
      type="number"
      id="quantity"
      placeholder="Quantity"
   >

   <input
      type="number"
      id="unitPrice"
      placeholder="Unit Price"
   >

   <button onclick="saveSale()">
      Save Sale
   </button>

   <div id="message"></div>


   <!-- TABLE -->

   <table border="1">

      <thead>
         <tr>
            <th>Customer</th>
            <th>Quantity</th>
            <th>Unit Price</th>
            <th>Total</th>
         </tr>
      </thead>

      <tbody id="salesTable">

      </tbody>

   </table>

   <script src="app.js"></script>

</body>
</html>
